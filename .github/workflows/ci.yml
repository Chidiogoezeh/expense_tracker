name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: expense_tracker_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d expense_tracker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/expense_tracker_test
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/expense_tracker_test
      SQLX_OFFLINE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run integration and unit tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release

      - name: Build Docker image
        run: docker build -t personal-finance-api:ci .
