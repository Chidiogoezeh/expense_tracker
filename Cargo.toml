[package]
name = "expense_tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
argon2 = "0.6"
jsonwebtoken = "11"
dotenvy = "0.15"
validator = { version = "0.21.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tower-http = { version = "0.7.1", features = ["trace"] }
