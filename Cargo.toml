[package]
name = "expense_tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
